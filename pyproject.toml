[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restic-tui"
version = "0.1.0"
description = "Asistente de terminal para backups con restic"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/nicolasdavidgilbert/restic-tui"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
backup = "restic_tui.cli:main"
restic-tui = "restic_tui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
